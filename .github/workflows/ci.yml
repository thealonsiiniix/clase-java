name: "Construccion y carga de imagen"

on:
  push:
    # El despliegue solo ocurre cuando se hace push a main (o una rama estable)
    # branches: [ "main" ]
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions

jobs:
  build-and-push:
    name: "Build Docker Image & Push"
    runs-on: ubuntu-latest
    
    steps:
      - name: "traer mi code"
        uses: actions/checkout@v4

      - name: "Set up JDK 21"
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: "Login to Docker Hub"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      #instala un constructor avanzado (BuildKit). Este es el que permite que el proceso sea rápido y use "caché inteligente" en la nube.
      - name: "construccion y publicacion de imagen"
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{secrets.DOCKERHUB_USERNAME}}/suscripciones:latest
            ${{secrets.DOCKERHUB_USERNAME}}/suscripciones:${{github.run_number}}
        